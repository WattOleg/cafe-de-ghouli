<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080b08">
<title>Инвентарь — Café de Ghouli</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & VARS ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080b08;--bg2:#0d120d;--bg3:#111811;
  --green:#3ddc6e;--green2:#2ab855;--green-dim:#1a5c2e;
  --green-glow:rgba(61,220,110,.12);--green-glow2:rgba(61,220,110,.06);
  --purple:#a855f7;--purple2:#7c3aed;--purple-dim:#3b1f6b;
  --purple-glow:rgba(168,85,247,.15);
  --text:#e4ede4;--text-dim:#7a9a7a;--text-muted:#3a5a3a;
  --border:#1a2e1a;--border2:#243624;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── APP SHELL ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:540px;margin:0 auto;position:relative}

/* ── STATUS BAR SAFE AREA ── */
.topbar{
  padding:calc(var(--safe-top) + 16px) 18px 14px;
  flex-shrink:0;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
  position:relative;z-index:200;
}

.brand-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.brand-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)}
.brand-name{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-top:2px}
.sync-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.06em;padding:7px 12px;border-radius:10px;cursor:pointer;
  transition:all .2s;flex-shrink:0;margin-top:4px;
}
.sync-btn:hover{border-color:var(--green-dim);color:var(--green)}
.sync-btn.syncing{color:var(--green);border-color:var(--green-dim)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);transition:background .3s}
.sync-btn.syncing .sync-dot{background:var(--green);animation:pulse 1s infinite}
.sync-btn.error .sync-dot{background:#cc4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── SEARCH ── */
.search-wrap{position:relative}
.search-box{
  width:100%;background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:14px;padding:13px 46px 13px 18px;
  font-family:'Syne',sans-serif;font-size:16px;font-weight:600;
  color:var(--text);outline:none;caret-color:var(--green);
  transition:border-color .2s,box-shadow .2s;
  /* Prevent iOS zoom */
  font-size:max(16px,1rem);
}
.search-box:focus{border-color:var(--green-dim);box-shadow:0 0 0 3px var(--green-glow2)}
.search-box::placeholder{color:var(--text-muted);font-weight:400}
.search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:18px;height:18px;pointer-events:none;transition:color .2s}
.search-box:focus~.search-icon{color:var(--green)}
.clear-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--bg2);border:1px solid var(--border2);color:var(--text-dim);width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;font-size:15px;display:none;line-height:1}
.search-box:not(:placeholder-shown)~.search-icon{display:none}
.search-box:not(:placeholder-shown)~.clear-btn{display:flex}

/* ── DROPDOWN ── */
.dropdown{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--bg3);border:1.5px solid var(--border2);border-radius:16px;
  overflow:hidden;z-index:200;max-height:55vh;overflow-y:auto;display:none;
  box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 1px rgba(61,220,110,.06);
  -webkit-overflow-scrolling:touch;
}
.dropdown.visible{display:block;animation:dropIn .18s cubic-bezier(.34,1.2,.64,1) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dropdown-item{display:flex;align-items:center;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;gap:12px;min-height:60px}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:active{background:var(--green-glow2)}
.di-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.di-info{flex:1;min-width:0}
.di-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-name mark{background:none;color:var(--green);font-weight:800}
.di-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px;letter-spacing:.04em}
.di-current{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;flex-shrink:0}
.di-current.has{color:var(--green)}
.di-current.zero{color:var(--text-muted)}
.no-results{padding:28px;text-align:center;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:12px}

/* ── QUICKADD PANEL ── */
.quickadd{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--bg3);border:1.5px solid var(--purple-dim);border-radius:20px;
  padding:18px;z-index:300;display:none;
  box-shadow:0 24px 70px rgba(0,0,0,.8),0 0 40px rgba(168,85,247,.12);
}
.quickadd.visible{display:block;animation:qaIn .22s cubic-bezier(.34,1.2,.64,1) both}
@keyframes qaIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.qa-handle{display:none}
.qa-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qa-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.qa-texts{flex:1;min-width:0}
.qa-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qa-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px}
.qa-close{background:var(--bg2);border:1px solid var(--border2);color:var(--text-dim);width:28px;height:28px;min-width:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qa-current{background:var(--bg2);border:1px solid var(--border2);border-radius:11px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.qa-current-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}
.qa-current-val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;color:var(--green)}
.qa-current-val.zero{color:var(--text-muted)}
.qa-input-row{display:flex;gap:8px;align-items:stretch}
.qa-input{flex:1;background:var(--bg2);border:1.5px solid var(--border2);border-radius:12px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:var(--text);outline:none;text-align:center;transition:border-color .2s,box-shadow .2s;caret-color:var(--purple);-webkit-appearance:none}
.qa-input:focus{border-color:var(--purple-dim);box-shadow:0 0 0 3px var(--purple-glow)}
.qa-unit-badge{background:var(--purple-dim);border-radius:10px;padding:0 14px;display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--purple)}
.qa-actions{display:flex;gap:8px;margin-top:10px}
.qa-btn-add{flex:1;background:var(--green2);border:none;border-radius:11px;padding:13px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#080b08;cursor:pointer;transition:all .15s;-webkit-appearance:none}
.qa-btn-add:active{background:var(--green);transform:scale(.98)}
.qa-btn-replace{background:var(--bg2);border:1.5px solid var(--border2);border-radius:11px;padding:13px 14px;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-appearance:none}
.qa-btn-replace:active{color:var(--text)}
.qa-btn-reset{background:transparent;border:1.5px solid #3a1a1a;border-radius:11px;padding:13px 14px;color:#8a4444;cursor:pointer;font-size:14px;transition:all .15s;-webkit-appearance:none}
.qa-btn-reset:active{border-color:#8a4444;color:#cc6666}
.qa-btn-subtract{flex:1;background:var(--bg2);border:1.5px solid var(--purple-dim);border-radius:11px;padding:13px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--purple);cursor:pointer;transition:all .15s;-webkit-appearance:none}
.qa-btn-subtract:active{background:var(--purple-glow);transform:scale(.98)}

/* ── MAIN LIST ── */
.list-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 18px calc(90px + var(--safe-bot));-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.list-wrap::-webkit-scrollbar{display:none}

/* offline badge */
.offline-banner{display:none;background:#3a2200;border:1px solid #664400;border-radius:10px;padding:8px 14px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#cc8800;text-align:center}
.offline-banner.show{display:block}

/* ── SECTION TABS ── */
.section-tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.section-tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:var(--bg3);border:1.5px solid var(--border2);color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap;-webkit-appearance:none}
.tab-btn:active{transform:scale(.97)}
.tab-btn.active{background:var(--green-dim);border-color:var(--green2);color:var(--green)}

.cat-group{margin-bottom:4px}
.cat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);padding:14px 4px 6px;display:flex;align-items:center;gap:8px}
.cat-label::after{content:'';flex:1;height:1px;background:var(--border)}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.item-card{display:flex;align-items:center;padding:11px 12px;border-radius:13px;cursor:pointer;transition:background .1s;gap:11px;margin-bottom:2px;min-height:58px}
.item-card:active{background:var(--bg3);transform:scale(.99)}
.item-card.has-val{background:var(--green-glow2)}
.item-card.has-val:active{background:rgba(61,220,110,.1)}
.item-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;border:1px solid var(--border2)}
.item-body{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px}
.item-right{text-align:right;flex-shrink:0;min-width:48px}
.item-total{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500}
.item-total.has{color:var(--green)}
.item-total.none{color:var(--border2);font-size:20px;font-weight:300;line-height:1}
.item-unit-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:1px}

/* empty / loading */
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  padding:12px 18px calc(10px + var(--safe-bot));
  background:linear-gradient(0deg,var(--bg) 55%,transparent);
  pointer-events:none;
  z-index:2;
}
.bottom-stats{background:var(--bg3);border:1px solid var(--border2);border-radius:15px;padding:11px 16px;display:flex;align-items:center;pointer-events:all}
.bstat{flex:1;text-align:center}
.bstat+.bstat{border-left:1px solid var(--border)}
.bstat-val{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:500;color:var(--green)}
.bstat-val.purple{color:var(--purple)}
.bstat-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.export-btn{background:var(--green-dim);border:1px solid var(--green2);border-radius:10px;padding:0 14px;display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--green);cursor:pointer;letter-spacing:.06em;height:100%;min-width:70px;justify-content:center;transition:all .15s}
.export-btn:active{background:rgba(42,184,85,.2)}

.progress-strip{height:3px;background:var(--border);border-radius:2px;margin:8px 2px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── TOAST ── */
.toast{position:fixed;top:calc(var(--safe-top) + 12px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg3);border:1px solid var(--green-dim);border-radius:12px;padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green);z-index:999;transition:transform .3s cubic-bezier(.34,1.2,.64,1);white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:none;max-width:90vw;text-overflow:ellipsis;overflow:hidden}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── EDIT MODE ── */
.edit-btn{background:var(--bg3);border:1.5px solid var(--border2);color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;padding:6px 11px;border-radius:10px;cursor:pointer;transition:all .2s;-webkit-appearance:none}
.edit-btn.active{background:rgba(251,146,60,.15);border-color:#fb923c;color:#fb923c}
.qa-edit-trigger{background:transparent;border:none;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;cursor:pointer;padding:0;-webkit-appearance:none;transition:color .15s}
.qa-edit-trigger:active{color:var(--text)}
.item-card.edit-mode{cursor:default}
.item-edit-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text-muted);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;transition:all .15s}
.item-edit-btn:active{background:var(--bg3);color:var(--text)}
.item-del-btn{background:rgba(139,0,0,.2);border:1px solid #5a1a1a;color:#cc4444;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;transition:all .15s}
.item-del-btn:active{background:rgba(139,0,0,.4)}
/* Edit modal */
.edit-modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center}
.edit-modal.visible{display:flex}
.edit-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.edit-modal-box{position:relative;background:var(--bg3);border:1.5px solid var(--border2);border-radius:20px 20px 0 0;width:100%;max-width:540px;padding:20px 20px calc(20px + var(--safe-bot));z-index:1;animation:qaIn .25s cubic-bezier(.34,1.2,.64,1) both}
.edit-modal-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.edit-field{margin-bottom:12px}
.edit-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);letter-spacing:.08em;margin-bottom:5px;text-transform:uppercase}
.edit-field input{width:100%;background:var(--bg2);border:1.5px solid var(--border2);border-radius:11px;padding:12px 14px;font-family:'Syne',sans-serif;font-size:15px;color:var(--text);outline:none;caret-color:var(--green);transition:border-color .2s;-webkit-appearance:none}
.edit-field input:focus{border-color:var(--green-dim)}
.edit-save-btn{width:100%;background:var(--green2);border:none;border-radius:11px;padding:14px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#080b08;cursor:pointer;-webkit-appearance:none;margin-top:4px}
.edit-save-btn:active{background:var(--green)}
.add-item-btn{width:100%;background:transparent;border:1.5px dashed var(--border2);border-radius:13px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);cursor:pointer;letter-spacing:.06em;margin-top:8px;transition:all .2s;-webkit-appearance:none;display:none}
.add-item-btn.visible{display:block}
.add-item-btn:active{border-color:var(--green-dim);color:var(--green)}
.toast.err{color:#cc6666;border-color:#662222}

/* OVERLAY */
.overlay{display:none}
.overlay.visible{display:block}
</style>
<script>
// Generate PNG icon via canvas for iOS home screen
(function(){
  var c = document.createElement('canvas');
  c.width = c.height = 512;
  var ctx = c.getContext('2d');
  // Background
  var bg = ctx.createLinearGradient(0,0,512,512);
  bg.addColorStop(0,'#0d120d'); bg.addColorStop(1,'#080b08');
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, 512, 512, 110);
  ctx.fill();
  // Glow ring
  ctx.strokeStyle = '#3ddc6e'; ctx.lineWidth = 3; ctx.globalAlpha = 0.3;
  ctx.beginPath(); ctx.arc(256, 220, 130, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
  // Ghost body
  var grad = ctx.createLinearGradient(156,110,336,310);
  grad.addColorStop(0,'#1a3a2a'); grad.addColorStop(1,'#1a0a2a');
  ctx.fillStyle = grad;
  ctx.strokeStyle = '#3ddc6e'; ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(256,110);
  ctx.bezierCurveTo(196,110,156,152,156,210);
  ctx.lineTo(156,310);
  ctx.lineTo(186,290); ctx.lineTo(216,310);
  ctx.lineTo(246,290); ctx.lineTo(276,310);
  ctx.lineTo(306,290); ctx.lineTo(336,310);
  ctx.lineTo(336,210);
  ctx.bezierCurveTo(336,152,316,110,256,110);
  ctx.fill(); ctx.stroke();
  // Eyes
  ctx.fillStyle='#3ddc6e'; ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.arc(222,205,18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a855f7';
  ctx.beginPath(); ctx.arc(290,205,18,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#080b08';
  ctx.beginPath(); ctx.arc(228,199,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(296,199,7,0,Math.PI*2); ctx.fill();
  // Smile
  ctx.strokeStyle='#3ddc6e'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(228,242); ctx.quadraticCurveTo(256,264,284,242); ctx.stroke();
  // Text
  ctx.fillStyle='#3ddc6e'; ctx.font='bold 40px Georgia,serif';
  ctx.textAlign='center'; ctx.letterSpacing='3px';
  ctx.fillText('GHOULI', 256, 395);
  ctx.fillStyle='#7a9a7a'; ctx.font='20px Georgia,serif';
  ctx.fillText('inventory', 256, 430);
  // Set as icon
  var png = c.toDataURL('image/png');
  document.getElementById('appIcon').href = png;
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }
})();
</script>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand-row">
      <div>
        <div class="brand-label">Инвентаризация</div>
        <div class="brand-name">Café de Ghouli</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <button class="sync-btn" id="syncBtn" onclick="syncNow()">
          <div class="sync-dot" id="syncDot"></div>
          <span id="syncLabel">Сохранить</span>
        </button>
        <div id="visitCounter" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);letter-spacing:.06em"></div>

    <!-- SECTION TABS -->
    <div class="section-tabs" id="sectionTabs">
      <button class="tab-btn active" id="tab-бар" onclick="switchSection('бар')">🍸 Бар</button>
      <button class="tab-btn" id="tab-кухня" onclick="switchSection('кухня')">🍳 Кухня</button>
      <button class="tab-btn" id="tab-кондитерская" onclick="switchSection('кондитерская')">🎂 Кондитерская</button>
      <button class="tab-btn" id="tab-зал" onclick="switchSection('зал')">🍽️ Зал</button>
    </div>

    <!-- SEARCH -->
    <div class="search-wrap" id="searchWrap">
      <input type="text" class="search-box" id="searchInput"
        placeholder="Поиск позиции..."
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        oninput="onSearch()" onfocus="onSearchFocus()" onkeydown="onSearchKey(event)">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/>
      </svg>
      <button class="clear-btn" onclick="clearSearch()">×</button>
      <div class="dropdown" id="dropdown"></div>
      <div class="quickadd" id="quickadd"></div>
    </div>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <!-- LIST -->
  <div class="list-wrap" id="listWrap">
    <div class="offline-banner" id="offlineBanner">⚠ Офлайн-режим — данные сохранятся при подключении</div>
    <div class="state-msg" id="loadingMsg">
      <div class="spinner"></div>
      <span>Загрузка справочника...</span>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <div class="bottom-stats">
      <div class="bstat"><div class="bstat-val" id="bsFilled">0</div><div class="bstat-label">Заполнено</div></div>
      <div class="bstat"><div class="bstat-val purple" id="bsTotal">—</div><div class="bstat-label">Позиций</div></div>
      <div class="bstat"><div class="bstat-val" id="bsPct">0%</div><div class="bstat-label">Готово</div></div>
      <button class="export-btn" onclick="exportCSV()">↓ CSV</button>
    </div>
    <div class="progress-strip"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<!-- PIN MODAL -->
<div class="edit-modal" id="pinModal">
  <div class="edit-modal-backdrop" onclick="closePinModal()"></div>
  <div class="edit-modal-box">
    <div class="edit-modal-title">Введите PIN для редактирования</div>
    <div class="edit-field">
      <label>PIN-код</label>
      <input type="password" inputmode="numeric" id="pinInput" placeholder="••••" maxlength="6"
        onkeydown="if(event.key==='Enter') checkPin()">
    </div>
    <button class="edit-save-btn" onclick="checkPin()">Войти</button>
  </div>
</div>

<!-- EDIT ITEM MODAL -->
<div class="edit-modal" id="editModal">
  <div class="edit-modal-backdrop" onclick="closeEditModal()"></div>
  <div class="edit-modal-box">
    <div class="edit-modal-title" id="editModalTitle">Редактировать позицию</div>
    <input type="hidden" id="editItemId">
    <input type="hidden" id="editItemRowNum">
    <div class="edit-field"><label>Название</label><input type="text" id="editName" placeholder="Название позиции"></div>
    <div class="edit-field"><label>Ед. изм.</label><input type="text" id="editUnit" placeholder="шт / л / кг"></div>
    <div class="edit-field"><label>Категория</label><input type="text" id="editCategory" placeholder="Категория"></div>
    <div class="edit-field"><label>Код (необязательно)</label><input type="text" id="editCode" placeholder="123456"></div>
    <button class="edit-save-btn" onclick="saveEditedItem()">Сохранить</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  CONFIG — замени на свой URL после деплоя Apps Script
// ══════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycby7Bi081oC_CQbHu_B1j1pmMiRV5KoAYfT3neLkKUPqaMvR9UBE0ZRnJUzjb4Vp8B87sQ/exec';

// ── STATE ─────────────────────────────────────────────
let catalog = [];      // [{id,code,name,category,unit}]
let cats = [];         // [{name,emoji,color,items:[...]}]
let totals = {};       // id → number
let dirty = new Set(); // ids changed since last sync
let activeItem = null;
let editMode = false;
let syncTimer = null;
let isOnline = navigator.onLine;
const TODAY = todayStr();
let currentSection = localStorage.getItem('lastSection') || 'бар';

const SECTIONS = {
  'бар':           { label: '🍸 Бар',           sheet: 'Справочник_бар' },
  'кухня':         { label: '🍳 Кухня',          sheet: 'Справочник_кухня' },
  'кондитерская':  { label: '🎂 Кондитерская',   sheet: 'Справочник_кондитерская' },
  'зал':           { label: '🍽️ Зал',            sheet: 'Справочник_зал' },
};

// ── CATEGORY STYLE MAP ────────────────────────────────
const CAT_STYLES = {
  'Апперетив':       {emoji:'🍸',color:'#a855f7'},
  'Шампанское':      {emoji:'🍾',color:'#f0d060'},
  'Игристое вино':   {emoji:'🥂',color:'#c084fc'},
  'Белое вино':      {emoji:'🫗',color:'#e2d784'},
  'Розовое вино':    {emoji:'🌸',color:'#f9a8d4'},
  'Красное вино':    {emoji:'🍷',color:'#c0392b'},
  'Пиво':            {emoji:'🍺',color:'#f59e0b'},
  'Виски':           {emoji:'🥃',color:'#fbbf24'},
  'Коньяк':          {emoji:'🫙',color:'#f97316'},
  'Ром':             {emoji:'🌴',color:'#34d399'},
  'Водка':           {emoji:'❄️',color:'#60a5fa'},
  'Джин':            {emoji:'🌿',color:'#4ade80'},
  'Вермут':          {emoji:'🍹',color:'#e879f9'},
  'Ликер':           {emoji:'🍬',color:'#d946ef'},
  'Безалкогольные':  {emoji:'💧',color:'#38bdf8'},
  'Чай':             {emoji:'🍵',color:'#86efac'},
  'Матча':           {emoji:'🍃',color:'#4ade80'},
  'Кофе':            {emoji:'☕',color:'#a16207'},
  'Фрукты':          {emoji:'🍋',color:'#facc15'},
  'Ягоды':           {emoji:'🍓',color:'#f43f5e'},
  'Специи':          {emoji:'🌶️',color:'#ef4444'},
  'Полу-фабрикаты':  {emoji:'🥘',color:'#fb923c'},
  'Прочее':          {emoji:'📦',color:'#94a3b8'},
};
function catStyle(name) {
  return CAT_STYLES[name] || {emoji:'📦',color:'#94a3b8'};
}

// ── INIT ─────────────────────────────────────────────
window.addEventListener('online',  () => { isOnline=true;  updateOfflineBanner(); flushDirty(); });
window.addEventListener('offline', () => { isOnline=false; updateOfflineBanner(); });

// ── EDIT MODE ────────────────────────────────────
function toggleEditMode(on) {
  if (!pinUnlocked && (on === true || on === undefined)) {
    // Don't enable without PIN
    return;
  }
  editMode = (on !== undefined) ? on : !editMode;
  renderList();
}

function openEditModal(itemId) {
  const item = catalog.find(i => i.id === itemId);
  if (!item) return;
  document.getElementById('editModalTitle').textContent = 'Редактировать позицию';
  document.getElementById('editItemId').value = item.id;
  document.getElementById('editItemRowNum').value = item.rowNum || '';
  document.getElementById('editName').value = item.name;
  document.getElementById('editUnit').value = item.unit;
  document.getElementById('editCategory').value = item.category;
  document.getElementById('editCode').value = item.code || '';
  document.getElementById('editModal').classList.add('visible');
  setTimeout(() => document.getElementById('editName').focus(), 80);
}

function openAddModal() {
  document.getElementById('editModalTitle').textContent = 'Новая позиция';
  document.getElementById('editItemId').value = '';
  document.getElementById('editItemRowNum').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editUnit').value = '';
  document.getElementById('editCategory').value = '';
  document.getElementById('editCode').value = '';
  document.getElementById('editModal').classList.add('visible');
  setTimeout(() => document.getElementById('editName').focus(), 80);
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('visible');
}

async function saveEditedItem() {
  const id = document.getElementById('editItemId').value;
  const rowNum = document.getElementById('editItemRowNum').value;
  const name = document.getElementById('editName').value.trim();
  const unit = document.getElementById('editUnit').value.trim() || 'шт';
  const category = document.getElementById('editCategory').value.trim() || 'Прочее';
  const code = document.getElementById('editCode').value.trim();
  if (!name) { document.getElementById('editName').focus(); return; }

  const btn = document.querySelector('.edit-save-btn');
  btn.textContent = 'Сохранение...'; btn.disabled = true;

  try {
    const result = await apiFetch({
      action: id ? 'editItem' : 'addItem',
      sheet: SECTIONS[currentSection].sheet,
      id: id,
      rowNum: rowNum,
      name: name,
      unit: unit,
      category: category,
      code: code
    });

    if (result.error) throw new Error(result.error);

    closeEditModal();
    // Refresh catalog
    catalog = [];
    await loadCatalog();
    renderList();
    showToast(id ? '✓ Позиция обновлена' : '✓ Позиция добавлена');
  } catch(e) {
    showToast('Ошибка: ' + e.message, true);
  } finally {
    btn.textContent = 'Сохранить'; btn.disabled = false;
  }
}

async function deleteItem(itemId) {
  const item = catalog.find(i => i.id === itemId);
  if (!item) return;
  if (!confirm('Удалить «' + item.name + '»?')) return;
  try {
    const result = await apiFetch({
      action: 'deleteItem',
      sheet: SECTIONS[currentSection].sheet,
      rowNum: item.rowNum
    });
    if (result.error) throw new Error(result.error);
    catalog = [];
    await loadCatalog();
    renderList();
    showToast('↺ Позиция удалена');
  } catch(e) {
    showToast('Ошибка: ' + e.message, true);
  }
}

// ── PIN / EDIT AUTH ──────────────────────────────
const EDIT_PIN = '1234'; // смени на свой PIN
let pendingEditItemId = null;
let pinUnlocked = false;

function requestEditPin(itemId) {
  pendingEditItemId = itemId;
  if (pinUnlocked) {
    openEditModal(itemId);
    return;
  }
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModal').classList.add('visible');
  setTimeout(() => document.getElementById('pinInput').focus(), 80);
}

function checkPin() {
  const val = document.getElementById('pinInput').value;
  if (val === EDIT_PIN) {
    pinUnlocked = true;
    editMode = true;
    closePinModal();
    renderList();
    if (pendingEditItemId === '__add__') {
      openAddModal();
    } else if (pendingEditItemId) {
      openEditModal(pendingEditItemId);
    }
  } else {
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').placeholder = 'Неверный PIN';
    setTimeout(() => document.getElementById('pinInput').placeholder = '••••', 1500);
  }
}

function closePinModal() {
  document.getElementById('pinModal').classList.remove('visible');
}

// ── SECTION SWITCH ───────────────────────────────
async function switchSection(section) {
  if (section === currentSection) return;
  // Save current dirty data first
  if (dirty.size > 0) await syncNow();
  currentSection = section;
  localStorage.setItem('lastSection', section);
  // Update tab UI
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tab = document.getElementById('tab-' + section);
  if (tab) tab.classList.add('active');
  // Reset state
  catalog = []; cats = []; totals = {}; dirty = new Set();
  clearSearch();
  document.getElementById('listWrap').innerHTML = `
    <div class="state-msg"><div class="spinner"></div><span>Загрузка...</span></div>`;
  await loadCatalog();
  await loadSession();
  renderList();
  updateStats();
}

// ── VISIT COUNTER ─────────────────────────────────
async function trackVisit() {
  try {
    const data = await apiFetch({action:'visit'});
    if (data.visits) {
      document.getElementById('visitCounter').textContent = '👁 ' + data.visits + ' открытий';
    }
  } catch(e) { /* silent */ }
}

// Close dropdowns when clicking outside search area
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('searchWrap');
  const qa = document.getElementById('quickadd');
  // Don't interfere if clicking a card or inside a card
  if (e.target.closest('.item-card')) return;
  if (!wrap.contains(e.target) && !qa.contains(e.target)) {
    closeDropdown();
    closeQuickAdd();
  }
});

(async function init() {
  loadLocal();
  // Restore last active section tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const activeTab = document.getElementById('tab-' + currentSection);
  if (activeTab) activeTab.classList.add('active');
  await loadCatalog();
  await loadSession();
  renderList();
  updateStats();
  trackVisit();
})();

// ── API ───────────────────────────────────────────────
// Apps Script делает 302 redirect перед ответом — нужен redirect:follow
async function apiFetch(params) {
  const url = API_URL + '?' + new URLSearchParams(params);
  const r = await fetch(url, { redirect: 'follow' });
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error('Ответ не JSON: ' + text.slice(0,300)); }
}

// Apps Script не поддерживает CORS preflight для POST
// Сохранение тоже через GET с параметром data=JSON
async function apiPost(body) {
  const params = new URLSearchParams({
    action: body.action,
    date: body.date || '',
    section: body.section || 'бар',
    data: JSON.stringify(body.items || [])
  });
  const r = await fetch(API_URL + '?' + params, { redirect: 'follow' });
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error('Ответ не JSON: ' + text.slice(0,300)); }
}

// ── LOAD CATALOG ─────────────────────────────────────
async function loadCatalog() {
  if (!isOnline) {
    // Offline fallback — use cache only if available
    const cached = localStorage.getItem('catalog');
    if (cached) {
      catalog = JSON.parse(cached);
      buildCats();
      hideLoading();
    } else {
      showError('Нет подключения к Google Sheets');
    }
    return;
  }
  try {
    // Always fetch fresh from Sheets
    const data = await apiFetch({action:'catalog', sheet: SECTIONS[currentSection].sheet});
    if (data.error) { showError('Ошибка: ' + data.error); return; }
    if (data.items && data.items.length) {
      catalog = data.items;
      localStorage.setItem('catalog', JSON.stringify(catalog));
      buildCats();
      hideLoading();
    }
  } catch(e) {
    // Network error — try cache
    const cached = localStorage.getItem('catalog');
    if (cached) {
      catalog = JSON.parse(cached);
      buildCats();
      hideLoading();
      showToast('⚠ Офлайн — данные из кеша', true);
    } else {
      showError('Нет подключения к Google Sheets');
    }
  }
}

async function loadSession() {
  if (!isOnline) return;
  try {
    // Always load fresh session — clears any stale local data
    const data = await apiFetch({action:'session', date:TODAY, section:currentSection});
    if (data.items !== undefined) {
      // Reset totals completely, then apply what's in Sheets
      totals = {};
      data.items.forEach(item => {
        if (item.total > 0) totals[item.id] = item.total;
      });
      saveLocal();
    }
  } catch(e) { /* use local */ }
}

function buildCats() {
  const map = {};
  catalog.forEach(item => {
    if (!map[item.category]) map[item.category] = [];
    map[item.category].push(item);
  });
  const style = catStyle;
  cats = Object.entries(map).map(([name, items]) => ({
    name, items, ...style(name)
  }));
}

function hideLoading() {
  const el = document.getElementById('loadingMsg');
  if (el) el.remove();
}

function showError(msg) {
  const wrap = document.getElementById('listWrap');
  wrap.innerHTML = `<div class="state-msg">⚠<span>${msg}</span></div>`;
}

// ── LOCAL STORAGE ─────────────────────────────────────
function saveLocal() {
  localStorage.setItem('totals_'+currentSection+'_'+TODAY, JSON.stringify(totals));
}

function loadLocal() {
  const t = localStorage.getItem('totals_'+currentSection+'_'+TODAY);
  if (t) totals = JSON.parse(t);
}

// ── SYNC ─────────────────────────────────────────────
function scheduleSave() {
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(flushDirty, 4000);
}

async function flushDirty() {
  if (!dirty.size || !isOnline) return;
  setSyncState('syncing');
  try {
    const items = [...dirty].map(id => {
      const item = catalog.find(i=>i.id===id);
      if (!item) return null;
      return {id, code:item.code, name:item.name, unit:item.unit, total:totals[id]||0};
    }).filter(Boolean);

    if (!items.length) { setSyncState('ok'); return; }
    await apiPost({action:'saveAll', date:TODAY, section:currentSection, items: allFilledItems()});
    dirty.clear();
    setSyncState('ok');
  } catch(e) {
    setSyncState('error');
  }
}

function allFilledItems() {
  return catalog
    .filter(i => (totals[i.id]||0) > 0)
    .map(i => ({id:i.id, code:i.code, name:i.name, unit:i.unit, total:totals[i.id]}));
}

async function syncNow() {
  if (!isOnline) { showToast('⚠ Нет подключения', true); return; }
  setSyncState('syncing');
  try {
    await apiPost({action:'saveAll', date:TODAY, section:currentSection, items: allFilledItems()});
    dirty.clear();
    setSyncState('ok');
    showToast('✓ Сохранено в Google Sheets');
  } catch(e) {
    setSyncState('error');
    showToast('Ошибка синхронизации', true);
  }
}

function setSyncState(state) {
  const btn = document.getElementById('syncBtn');
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  btn.className = 'sync-btn ' + (state==='syncing'?'syncing':state==='error'?'error':'');
  lbl.textContent = state==='syncing'?'Сохраняю…':state==='error'?'Ошибка':'Сохранить';
}

// ── OFFLINE BANNER ────────────────────────────────────
function updateOfflineBanner() {
  document.getElementById('offlineBanner').classList.toggle('show', !isOnline);
}

// ── SEARCH ────────────────────────────────────────────
// Active list filter (set by Enter)
let listFilter = '';

function onSearch() {
  closeQuickAdd();
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { closeDropdown(); if(listFilter) { listFilter=''; renderList(); } return; }
  const res = catalog.filter(i =>
    i.name.toLowerCase().includes(q.toLowerCase()) ||
    (i.code && i.code.includes(q))
  ).slice(0,10);
  renderDropdown(res, q);
}

function onSearchKey(e) {
  if (e.key === 'Enter') {
    const q = document.getElementById('searchInput').value.trim();
    listFilter = q;
    closeDropdown();
    document.getElementById('searchInput').blur();
    renderList(q);  // filter the main list
  }
  if (e.key === 'Escape') { clearSearch(); }
}

function onSearchFocus() {
  const q = document.getElementById('searchInput').value.trim();
  if (q) onSearch();
}

function renderDropdown(items, q) {
  const dd = document.getElementById('dropdown');
  if (!items.length) {
    dd.innerHTML = '<div class="no-results">Ничего не найдено 🔍</div>';
    dd.classList.add('visible');
    document.getElementById('overlay').classList.add('visible');
    return;
  }
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  dd.innerHTML = items.map(item => {
    const total = totals[item.id] || 0;
    const st = catStyle(item.category);
    const hl = item.name.replace(new RegExp(`(${esc})`,'gi'),'<mark>$1</mark>');
    return `<div class="dropdown-item" onclick="openQuickAdd('${item.id}')">
      <div class="di-icon" style="background:${st.color}22;border:1px solid ${st.color}33">${st.emoji}</div>
      <div class="di-info">
        <div class="di-name">${hl}</div>
        <div class="di-meta">${item.category}${item.code?' · '+item.code:''}</div>
      </div>
      <div class="di-current ${total>0?'has':'zero'}">${total>0?fmt(total,item.unit):'—'}</div>
    </div>`;
  }).join('');
  dd.classList.add('visible');
  document.getElementById('overlay').classList.add('visible');
}

function closeDropdown() { document.getElementById('dropdown').classList.remove('visible'); }

function clearSearch() {
  document.getElementById('searchInput').value = '';
  listFilter = '';
  closeDropdown(); closeQuickAdd();
  document.getElementById('overlay').classList.remove('visible');
  renderList();
}

// ── QUICKADD ─────────────────────────────────────────
function openQuickAdd(itemId) {
  const item = catalog.find(i=>i.id===itemId);
  if (!item) return;
  activeItem = item;
  closeDropdown();
  const total = totals[item.id] || 0;
  const st = catStyle(item.category);
  const qa = document.getElementById('quickadd');
  qa.innerHTML = `
    <div class="qa-handle"></div>
    <div class="qa-header">
      <div class="qa-icon" style="background:${st.color}22;border:1px solid ${st.color}44">${st.emoji}</div>
      <div class="qa-texts">
        <div class="qa-name">${item.name}</div>
        <div class="qa-meta">${item.category}${item.code?' · '+item.code:''}</div>
      </div>
      <button class="qa-close" onclick="closeQuickAdd()">×</button>
    </div>
    <div style="text-align:right;margin-bottom:10px">
      <button class="qa-edit-trigger" onclick="requestEditPin('${item.id}')">✏️ Редактировать</button>
    </div>
    <div class="qa-current">
      <div class="qa-current-label">Текущий остаток</div>
      <div class="qa-current-val ${total===0?'zero':''}">${total>0?fmt(total,item.unit):'—'}</div>
    </div>
    <div class="qa-input-row">
      <input type="number" inputmode="decimal" class="qa-input" id="qaInput"
        placeholder="0" step="0.0001" min="0" onkeydown="qaKeydown(event)">
      <div class="qa-unit-badge">${item.unit}</div>
    </div>
    <div class="qa-actions">
      <button class="qa-btn-add" onclick="qaAdd()">＋ Добавить</button>
      <button class="qa-btn-subtract" onclick="qaSubtract()">− Вычесть</button>
    </div>
    <div class="qa-actions" style="margin-top:6px">
      <button class="qa-btn-replace" onclick="qaReplace()">Заменить</button>
      ${total>0?'<button class="qa-btn-reset" onclick="qaReset()">↺ Сброс</button>':''}
    </div>`;
  qa.classList.add('visible');
  document.getElementById('overlay').classList.add('visible');
  setTimeout(() => document.getElementById('qaInput')?.focus(), 80);
}

function closeQuickAdd() {
  document.getElementById('quickadd').classList.remove('visible');
  activeItem = null;
}

function closeAll() {
  closeDropdown(); closeQuickAdd();
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('searchInput').blur();
}

function qaKeydown(e) { if(e.key==='Enter') qaAdd(); if(e.key==='Escape') closeAll(); }

function commitValue(newTotal) {
  const item = activeItem;
  totals[item.id] = newTotal;
  dirty.add(item.id);
  saveLocal();
  closeAll(); clearSearch();
  updateCard(item.id); updateStats();
  scheduleSave();
  const label = item.name.split(' ').slice(0,3).join(' ');
  showToast(newTotal > 0 ? `✓ ${label} → ${fmt(newTotal, item.unit)}` : `↺ ${label} — сброшен (0)`);
}

function qaAdd() {
  const raw = document.getElementById('qaInput')?.value ?? '';
  const val = parseFloat(raw);
  if (!raw || isNaN(val) || val <= 0) { document.getElementById('qaInput')?.focus(); return; }
  // Use high-precision addition: round to 4 decimals to avoid floating point drift
  const current = totals[activeItem.id] || 0;
  const newTotal = Math.round((current + val) * 10000) / 10000;
  commitValue(newTotal);
}

function qaReplace() {
  const input = document.getElementById('qaInput');
  const raw = input?.value ?? '';
  if (raw === '') { input?.focus(); return; }  // empty → do nothing
  const val = parseFloat(raw);
  if (isNaN(val) || val < 0) { input?.focus(); return; }
  commitValue(val);  // 0 is valid — resets the item
}

function qaReset() { commitValue(0); }

function qaSubtract() {
  const input = document.getElementById('qaInput');
  const raw = input?.value ?? '';
  if (raw === '') { input?.focus(); return; }
  const val = parseFloat(raw);
  if (isNaN(val) || val <= 0) { input?.focus(); return; }
  const current = totals[activeItem.id] || 0;
  const newTotal = Math.max(0, Math.round((current - val) * 10000) / 10000);
  commitValue(newTotal);
}

// ── RENDER LIST ───────────────────────────────────────
function renderList(filter) {
  if (!cats.length) return;
  const q = (filter || listFilter || '').toLowerCase().trim();
  const wrap = document.getElementById('listWrap');
  const banner = document.getElementById('offlineBanner');
  wrap.innerHTML = '';
  if (banner) wrap.appendChild(banner);

  // Show active filter badge if filtering
  if (q) {
    const badge = document.createElement('div');
    badge.style.cssText = 'font-family:JetBrains Mono,monospace;font-size:11px;color:var(--green);padding:8px 4px 4px;letter-spacing:.06em;display:flex;align-items:center;gap:8px';
    badge.innerHTML = `<span>Фильтр: «${q}»</span><span onclick="clearSearch()" style="color:var(--text-muted);cursor:pointer;font-size:14px">×</span>`;
    wrap.appendChild(badge);
  }

  let totalShown = 0;
  cats.forEach(cat => {
    const items = q
      ? cat.items.filter(i => i.name.toLowerCase().includes(q) || (i.code && i.code.includes(q)))
      : cat.items;
    if (!items.length) return;
    totalShown += items.length;
    const group = document.createElement('div');
    group.className = 'cat-group';
    group.innerHTML = `
      <div class="cat-label">
        <div class="cat-dot" style="background:${cat.color}"></div>${cat.name}
      </div>
      ${items.map(item => cardHTML(item, cat)).join('')}`;
    wrap.appendChild(group);
  });

  if (q && totalShown === 0) {
    const empty = document.createElement('div');
    empty.className = 'state-msg';
    empty.innerHTML = '<span>Ничего не найдено</span>';
    wrap.appendChild(empty);
  }

  // Add item button — always visible, PIN gates access
  const addBtn = document.createElement('button');
  addBtn.id = 'addItemBtn';
  addBtn.className = 'add-item-btn visible';
  addBtn.textContent = '＋ Добавить позицию';
  addBtn.onclick = () => { if(pinUnlocked) openAddModal(); else requestEditPin('__add__'); };
  wrap.appendChild(addBtn);
}

function cardHTML(item, cat) {
  const total = totals[item.id] || 0;
  const has = total > 0;
  const st = cat ? {emoji: cat.emoji, color: cat.color} : catStyle(item.category);

  // Edit mode: show edit/delete buttons (PIN already verified)
  if (editMode) {
    return `<div class="item-card edit-mode" id="card-${item.id}" style="gap:8px">
      <div class="item-icon" style="background:${st.color}22;border-color:${st.color}33">${st.emoji}</div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-sub">${item.code||'без кода'} · ${item.unit} · ${item.category}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <div class="item-edit-btn" onclick="openEditModal('${item.id}')">✏️</div>
        <div class="item-del-btn" onclick="deleteItem('${item.id}')">🗑</div>
      </div>
    </div>`;
  }

  return `<div class="item-card${has?' has-val':''}" id="card-${item.id}" onclick="openQuickAdd('${item.id}')">
    <div class="item-icon" style="background:${st.color}22;border-color:${st.color}33">${st.emoji}</div>
    <div class="item-body">
      <div class="item-name">${item.name}</div>
      <div class="item-sub">${item.code||'без кода'} · ${item.unit}</div>
    </div>
    <div class="item-right">
      <div class="item-total ${has?'has':'none'}">${has?formatNum(total):'·'}</div>
      ${has?`<div class="item-unit-lbl">${item.unit}</div>`:''}
    </div>
  </div>`;
}


function updateCard(id) {
  const old = document.getElementById('card-'+id);
  if (!old) return;
  const item = catalog.find(i=>i.id===id);
  if (!item) return;
  const cat = cats.find(c=>c.name===item.category) || {emoji:'📦',color:'#94a3b8'};
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(item, cat);
  const el = tmp.firstElementChild;
  old.replaceWith(el);
  el.style.transition='background 0s';
  el.style.background='rgba(61,220,110,.2)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transition='background .7s';
    el.style.background='';
  }));
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function updateStats() {
  const tot = catalog.length;
  const fil = catalog.filter(i=>(totals[i.id]||0)>0).length;
  const pct = tot ? Math.round(fil/tot*100) : 0;
  document.getElementById('bsFilled').textContent = fil;
  document.getElementById('bsTotal').textContent = tot || '—';
  document.getElementById('bsPct').textContent = pct+'%';
  document.getElementById('progressFill').style.width = pct+'%';
}

// ── EXPORT CSV ────────────────────────────────────────
function exportCSV() {
  if (!catalog.length) { showToast('Справочник не загружен', true); return; }
  let csv = '\uFEFF'; // BOM for Excel
  csv += 'Дата,Категория,Код,Наименование,Ед.изм.,Остаток\n';
  cats.forEach(cat => {
    cat.items.forEach(item => {
      const total = totals[item.id] || 0;
      csv += `${TODAY},"${cat.name}","${item.code}","${item.name}",${item.unit},${total}\n`;
    });
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `inventory_${TODAY}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('✓ CSV скачан');
}

// ── HELPERS ───────────────────────────────────────────
function formatNum(v) {
  // Show up to 4 decimal places, no trailing zeros
  return Math.round(v * 10000) / 10000 + '';
}

function fmt(v, unit) {
  // Up to 4 decimal places, trim trailing zeros
  let s = parseFloat(v.toFixed(4)).toString();
  return s + ' ' + unit;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

let toastTimer;
function showToast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
</script>
